name: "[Workflow] On Source Change"

# Consumes the shared library at its Forgejo path. Per webgrip/workflows
# ADR-0002 the `.forgejo/` tree is the Forgejo-adapted mirror, and Forgejo
# consumers reference it by full URL rather than `org/repo` shorthand.

concurrency:
  group: push-${{ github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  static-analysis:
    name: "Static Analysis"
    uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/workflows/node-application-static-analysis.yml@main
    with:
      node-version: "22"
      package-manager: pnpm
      run-format-check: true
      run-lint: true
      run-typecheck: true
      run-audit: true
      run-knip: true

  unit-tests:
    name: "Unit Tests"
    needs:
      - static-analysis
    uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/workflows/node-application-tests.yml@main
    with:
      node-version: "22"
      package-manager: pnpm
      test-command: pnpm test

  content-validation:
    name: "Content Validation"
    needs:
      - static-analysis
    uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/workflows/node-application-tests.yml@main
    with:
      node-version: "22"
      package-manager: pnpm
      test-command: pnpm validate:content

  build:
    name: "Build Site"
    needs:
      - unit-tests
      - content-validation
    # The shared Node "tests" workflow is reused as a build gate via
    # test-command — the same pattern the org's dotnet/node monorepo example
    # uses for its frontend build step.
    uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/workflows/node-application-tests.yml@main
    with:
      node-version: "22"
      package-manager: pnpm
      test-command: pnpm build

  # ---------------------------------------------------------------------------
  # Deploy.
  #
  # Inlined on purpose. There is no Cloudflare workflow in webgrip/workflows yet
  # — this repo is the org's first Cloudflare consumer — and cross-repo
  # `workflow_call` to a local `./.forgejo/...` path is not something we have
  # verified on forgejo-runner. Phase 2 of the plan extracts this into
  # webgrip/workflows as `cloudflare-deploy.yml` in BOTH trees (.github/ and
  # .forgejo/, per that repo's two-tree ADR) and this becomes a `uses:`.
  #
  # wrangler is invoked through `pnpm dlx` rather than a marketplace action so
  # nothing depends on how the runner resolves third-party actions.
  # ---------------------------------------------------------------------------
  deploy-preview:
    name: "Deploy Preview"
    needs:
      - build
    if: github.ref != 'refs/heads/main'
    runs-on: docker
    environment: preview
    permissions:
      contents: read
    steps:
      # v5, not v6 — v6 is broken on non-GitHub runners (webgrip/workflows ADR-0002).
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # `versions upload` publishes a non-production version and prints a
          # preview URL. Reviewers see the rendered page, not the YAML diff —
          # the single highest-value CI feature for a content site.
          pnpm dlx wrangler versions upload | tee upload.log
          url="$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' upload.log | head -1 || true)"
          echo "preview-url=${url}" >> "$GITHUB_OUTPUT"

      - name: Report preview URL
        if: steps.upload.outputs.preview-url != ''
        run: |
          echo "Preview: ${{ steps.upload.outputs.preview-url }}" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: "Deploy Production"
    needs:
      - build
    if: github.ref == 'refs/heads/main'
    runs-on: docker
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler deploy

      - name: Smoke test
        run: |
          set -euo pipefail
          for path in /nl /en /nl/vacatures /en/jobs /events.ics /robots.txt; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "https://twente.dev${path}")"
            echo "${path} -> ${code}"
            [ "${code}" = "200" ] || { echo "FAIL ${path}"; exit 1; }
          done
