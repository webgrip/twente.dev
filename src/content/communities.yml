- id: tkkrlab
  # Points at .com, not their .nl: tkkrlab.nl returns SERVFAIL on Google Public DNS
  # (8.8.8.8) and times out on some resolvers, while 1.1.1.1 still answers from cache —
  # so the .nl link is dead for a large share of visitors. Not DNSSEC (no DS record, and
  # +cd does not help); their nameservers at nicolai.cloud are not answering
  # authoritatively. tkkrlab.com resolves everywhere and serves the current, actively
  # updated site. Checked 2026-08-30. Switch back once their .nl resolves again.
  name: TkkrLab
  url: https://tkkrlab.com/
  platform: other
  language: both
  focus:
    - hackerspace
    - hardware
    - electronics
    - making
  description:
    nl: >-
      Door de community gerund hackerspace/makerspace aan de Marssteden in
      Enschede met 3D-printers, lasersnijder en elektronicawerkplekken, met
      regelmatige workshops en CyberSaturday-avonden.
    en: >-
      Community-run hackerspace/makerspace at Marssteden in Enschede with 3D
      printers, a laser cutter and electronics benches, hosting regular
      workshops and CyberSaturday evenings.

