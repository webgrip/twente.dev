resolver: 8.8.8.8

mtaSts:
  policyInRepo: public/.well-known/mta-sts.txt
  policyUrl: https://mta-sts.twente.dev/.well-known/mta-sts.txt
  dnsRecordsPublished: true

domains:
  twente.dev:
    mx: [smtp.google.com]
    spf: v=spf1 include:_spf.google.com ~all
    dkim:
      - selector: google
        keyCharacters: 408
    dmarcPolicy: p=none
    dmarcReportsTo:
      [0525d8c91ea04d888744ae8a292691cc@dmarc-reports.cloudflare.net, dmarc@twente.dev]
    caa:
      published: true
      issuers:
        - letsencrypt.org
        - "pki.goog; cansignhttpexchanges=yes"
        - ssl.com
        - sectigo.com
    dnssec:
      dsPublished: true

  send.twente.dev:
    mx: []
    spf: deliberately-absent
    dkim:
      - selector: brevo1
      - selector: brevo2
    dmarcPolicy: p=none
    dmarcReportsTo:
      [
        0525d8c91ea04d888744ae8a292691cc@dmarc-reports.cloudflare.net,
        dmarc@twente.dev,
        rua@dmarc.brevo.com,
      ]
