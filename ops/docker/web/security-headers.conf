# Mirror of public/_headers. Change one, change both.
#
# This is a separate file because nginx's `add_header` does NOT inherit into a
# location block that declares its own — so the cache-control locations below
# would silently drop every security header if these were only set at server
# level. Each location includes this file explicitly.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
