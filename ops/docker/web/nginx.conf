# Serves dist/ the way Cloudflare Workers Static Assets serves it.
#
# The two behaviours worth reproducing, both configured in wrangler.toml:
#
#   html_handling = "auto-trailing-slash"
#       `astro build` with format:'file' emits /nl/events.html; the canonical
#       URL is /nl/events. Requests to the extensionless path serve the file,
#       and a request carrying .html redirects to the canonical form.
#
#   not_found_handling = "404-page"
#       Unmatched paths render /404.html *with a 404 status*. Serving that page
#       with a 200 is the classic soft-404 that gets a site's error page
#       indexed, so the status code matters as much as the body.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Emit relative Location headers. nginx's default builds an absolute URL
    # from the listen address, which behind any proxy — or in this container —
    # redirects the visitor to localhost:8080. Cloudflare redirects relatively.
    absolute_redirect off;

    # NOTE: do NOT add a server-level `types { ... }` block here. A second
    # `types` block does not extend the inherited mime.types map, it REPLACES
    # it — which serves every page, stylesheet and feed as
    # application/octet-stream, i.e. the browser downloads the site instead of
    # rendering it. The one missing mapping (.ics) is handled with
    # `default_type` in its own location instead.

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/calendar
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml;

    # Canonical form is extensionless. /nl/events.html -> /nl/events.
    # Anchored to a leading slash and a non-empty stem so it can never match
    # the bare /404.html internal redirect below.
    location ~ ^(/.+)\.html$ {
        return 301 $1$is_args$args;
    }

    # BEGIN generated from public/_redirects
    # Do not edit by hand — the rationale for each rule lives as comments in
    # public/_redirects; change that file and run `pnpm gen:ops`.

    location = / {
        return 302 /nl;
    }

    location = /001 {
        return 301 /nl/001;
    }

    location = /brand/twente-dev-mark.svg {
        return 301 /brand/mark.svg;
    }

    location = /brand/twente-dev-mark.png {
        return 301 /brand/png/mark-512.png;
    }

    location = /brand/twente-dev-logo.png {
        return 301 /brand/png/lockup-horizontal-512.png;
    }

    # END generated from public/_redirects

    # Fingerprinted filenames — safe to cache forever.
    location /_astro/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Mirrors public/_headers: only Pagefind's hashed index/fragment chunks are
    # immutable — the stable-named entry JSON, JS, CSS and wasm must revalidate
    # or search hard-breaks for returning visitors after a rebuild.
    location ~ ^/pagefind/(index|fragment)/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /pagefind/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    # Mirrors public/_headers: unfingerprinted press/brand assets, including
    # the og:image every unfurl bot fetches.
    location /brand/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location = /events.ics {
        include /etc/nginx/conf.d/security-headers.conf;
        # .ics is absent from nginx's mime.types; a calendar served as
        # application/octet-stream will not subscribe in any client.
        default_type text/calendar;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location ~ ^/(nl|en)/rss\.xml$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        # HTML is rewritten by every nightly rebuild; always revalidate.
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        # $uri.html is what makes /nl/events resolve to /nl/events.html.
        try_files $uri $uri.html $uri/index.html =404;
    }

    # `error_page` (not a try_files fallback) so the response carries a 404.
    error_page 404 /404.html;

    location = /404.html {
        internal;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # The headers file is Cloudflare's build-time input, not a public asset.
    location = /_headers {
        return 404;
    }
}
