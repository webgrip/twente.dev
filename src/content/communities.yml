- id: coderdojo-enschede
  # Their own host previously served a certificate for server97.icehosting.nl, so this
  # pointed at the Code Club/CoderDojo Foundation listing instead to avoid sending every
  # visitor into a full-page browser security warning. Re-checked 2026-08-30: the
  # certificate now validates (HTTP 200, ssl_verify_result 0), so the link points back at
  # the club's own site. Monthly sessions at Maakplaats053 in the Centrale Bibliotheek,
  # run by Stichting CoderDojo Twente.
  name: CoderDojo Enschede
  url: https://coderdojo-enschede.nl/
  platform: other
  language: nl
  focus:
    - kids
    - coding
    - education
  description:
    nl: >-
      Door vrijwilligers gerund gratis codeerclubje dat kinderen van 7 tot 17
      leert programmeren en websites, apps en games leert bouwen, elke eerste
      zaterdag van de maand in de Bibliotheek Enschede.
    en: >-
      Volunteer-run free coding club teaching children aged 7 to 17 to
