<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="twente.dev">
  <title>twente.dev — compact mark</title>
  <!-- Vector master of the compact mark (ratified 2026-08-11): warm-paper
       "t" on an ink badge, flag-red dot as the connector. Corner radius is
       30/160 of the size — keep the ratio when scaling. -->
  <rect width="160" height="160" rx="30" fill="#111820"/>
  <g fill="#f7f3ea">
    <rect x="65" y="25" width="30" height="110" rx="5"/>
    <rect x="25" y="50" width="110" height="30" rx="5"/>
  </g>
  <circle cx="120" cy="120" r="17.5" fill="#c3291b"/>
</svg>
