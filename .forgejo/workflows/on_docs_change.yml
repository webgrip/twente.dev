name: "[Workflow] On Documentation Change"

# Publishes this repo's docs to docs.webgrip.dev/twente-dev/ — the homelab
# ADR-0052 estate rollout: Zensical build + llms/redirect graft + gitleaks
# secret gate, then a prefix-scoped rclone sync into this repo's own bucket
# (bucket-per-repo isolation, after the 2026-08-11 estate wipe).
#
# source-dir is '.' here, not the estate default 'docs/techdocs': mkdocs.yml
# sits at the repo root with docs_dir: docs. See the comment at the top of
# mkdocs.yml for the reasoning.

on:
  push:
    branches:
      - "*"
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".forgejo/workflows/on_docs_change.yml"
  workflow_dispatch:
    inputs:
      source-dir:
        type: string
        description: "The directory containing the mkdocs config"
        required: false
        default: "."

jobs:
  generate-documentation:
    name: "Generate"
    uses: webgrip/workflows/.forgejo/workflows/techdocs-generate.yml@abf3c951d8243ef030421ab2acff0af9edce3215 # main
    with:
      source-dir: ${{ github.event.inputs.source-dir || '.' }}

  deploy-docs-site:
    name: "Deploy (docs site / Garage web)"
    uses: webgrip/workflows/.forgejo/workflows/techdocs-deploy-docs-site.yml@abf3c951d8243ef030421ab2acff0af9edce3215 # main
    needs: generate-documentation
    if: github.ref == 'refs/heads/main'
    with:
      source-dir: "."
      # Own bucket: this repo's key can touch nothing but docs-twente-dev
      # (+ -trash), so a bad sync can never clobber the rest of the estate.
      # Must be provisioned by the homelab bootstrap job before the first run,
      # together with the two TECHDOCS_S3_* repo secrets below.
      bucket: docs-twente-dev
      # Straight to 'true' rather than the usual onboard-at-false: verified
      # locally on 2026-08-30 with `zensical build --clean --strict` against
      # techdocs-builder:1.8.0 — "No issues found", so there are no broken
      # internal links to clean up first.
      strict: "true"
    secrets:
      TECHDOCS_S3_ACCESS_KEY_ID: ${{ secrets.TECHDOCS_S3_ACCESS_KEY_ID }}
      TECHDOCS_S3_SECRET_ACCESS_KEY: ${{ secrets.TECHDOCS_S3_SECRET_ACCESS_KEY }}
