# Real, verified communities (research pass 2026-08-11; activity and URLs
# checked via web search). This is the playbook's regional directory seed
# (TD-016): link out, credit the source, never claim ownership.
#
# NOTHING IN THIS FILE IS PUBLISHED UNTIL SOMEONE SAYS YES.
#
# The partner compact promises it in those words on a public page — "we zetten
# je er niet op zonder te vragen" — so an entry renders only once it carries a
# `consent` block. The schema defaults `consent.granted` to false, which means
# adding a group here is safe and reversible: it is research, not a listing.
# Publish one by adding, at the entry's top level:
#
#   consent:
#     granted: true
#     evidence: reply from <name>, <where>       # checkable by someone else
#     at: 2026-09-04
#
# Removing that block un-publishes it again, which is the one-message exit the
# compact promises. Ask during outreach; the honest question is "may we list
# you, and would you like the calendar feed?".
#
# Dormant groups deliberately NOT listed (last activity pre-2024): Twente.js,
# Functional Twente, PHP Twente, Docker/DevSecOps Enschede, WordPress Meetup
# Twente, Enschede Web Developers, Software Development Twente.

