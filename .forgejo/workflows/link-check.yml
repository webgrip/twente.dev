name: "[Scheduled] Link Check"

# Weekly sweep over the built output — via the shared link-check-static-site
# workflow (extracted 2026-09; this repo contributed the source-file checking
# and the multi-resolver DNS sweep, webgrip.nl the vacuous-run guard and the
# blocking-critical-link pattern). What stays here is exactly what is
# twente-specific: which files, which URL may never rot, which hosts.
#
# Community-submitted content links out to employer career pages and meetup
# sites, which rot faster than anything we control — a dead "Apply" link is
# the most damaging kind of broken link here.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  links:
    name: "Check links in built output"
    # TODO(post-merge): pin the tag cut by webgrip/workflows PR #58, then delete this line.
    uses: webgrip/workflows/.forgejo/workflows/link-check-static-site.yml@vTODO
    with:
      exclude-pattern: '^https://twente\.dev'
      # communities.yml is checked DIRECTLY, not via dist/: getCommunities()
      # was defined and never called, so no community URL was ever rendered
      # into a page and two of twelve had silently rotted before anyone looked.
      extra-sources: |
        src/content/communities.yml
      dns-hosts-source: src/content/communities.yml
      # The registration link may never rot silently once it exists; while
      # REGISTRATION_URL is null the command prints nothing and the check
      # honestly skips (there is no link on the site to guard yet).
      blocking-urls-command: >-
        node --experimental-strip-types -e
        'import("./src/config/site.ts").then((m) => console.log(m.REGISTRATION_URL ?? ""))'
