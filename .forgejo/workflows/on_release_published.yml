name: "[Workflow] On Release Published"

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-deploy
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  release-channel:
    name: "Release Channel"
    runs-on: docker
    outputs:
      channel: ${{ steps.parse.outputs.channel }}
    steps:
      - id: parse
        run: |
          set -euo pipefail
          tag='${{ github.event.release.tag_name }}'
          case "${tag}" in
            v*-*) channel=prerelease ;;
            v*) channel=stable ;;
            *) echo "unexpected release tag: ${tag}" >&2; exit 1 ;;
          esac
          echo "${tag} -> ${channel}"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: "Deploy Staging"
    needs:
      - release-channel
    uses: webgrip/workflows/.forgejo/workflows/cloudflare-deploy.yml@9d3da2af26bda748e13a85ab53fcc3c3ade4744d
    with:
      enabled: ${{ needs.release-channel.outputs.channel == 'prerelease' }}
      environment: production
      release-channel: prerelease
      wrangler-env: staging
      apex-url: "https://staging.twente.dev"
      edge-probe-path: /nl
      edge-probe-expect: "200"
      check-redirects: false
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-production:
    name: "Deploy Production"
    needs:
      - release-channel
    uses: webgrip/workflows/.forgejo/workflows/cloudflare-deploy.yml@9d3da2af26bda748e13a85ab53fcc3c3ade4744d
    with:
      enabled: ${{ needs.release-channel.outputs.channel == 'stable' }}
      environment: production
      release-channel: stable
      apex-url: "https://twente.dev"
      edge-probe-path: /nl
      smoke-paths: |
        /nl
        /en
        /nl/001
        /en/001
        /nl/bedrijven
        /en/companies
        /events.ics
        /nl/rss.xml
        /en/rss.xml
        /sitemap-index.xml
        /robots.txt
        /llms.txt
        /.well-known/security.txt
      not-found-path: /nl/this-page-does-not-exist
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
