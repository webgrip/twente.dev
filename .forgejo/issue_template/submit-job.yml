name: Submit a job / Vacature plaatsen
about: Post a developer vacancy at a Twente-based employer
title: "[Job] "
labels:
  - content
  - job
body:
  - type: markdown
    attributes:
      value: |
        Please read the [guidelines](https://twente.dev/en/guidelines) first.

        **We only accept vacancies posted by the employer itself.** Agencies and
        recruitment firms reposting third-party roles will be closed.

        Lees eerst de [richtlijnen](https://twente.dev/nl/richtlijnen). We nemen alleen
        vacatures aan die door de werkgever zelf worden geplaatst.

  - type: input
    id: company
    attributes:
      label: Company / Bedrijf
      description: Must already exist in the directory, or submit it first.
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Job title / Functietitel
    validations:
      required: true

  - type: dropdown
    id: workplace
    attributes:
      label: Workplace
      options:
        - onsite
        - hybrid
        - remote
    validations:
      required: true

  - type: input
    id: city
    attributes:
      label: City / Plaats
      placeholder: Enschede
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Is Dutch genuinely required?
      description: >-
        Be honest. A large share of developers here arrived via the University of
        Twente and do not speak Dutch. Marking a role "Dutch required" when it is
        not costs you good candidates.
      options:
        - "english-ok — English is fine"
        - "dutch-required — Dutch is genuinely required"
    validations:
      required: true

  - type: input
    id: salary
    attributes:
      label: Salary range / Salarisrange
      description: >-
        Optional but strongly encouraged — listings with a range visibly get more
        responses. Format: 4500-6000 per month, EUR.
      placeholder: "4500-6000 EUR/month"

  - type: input
    id: valid-through
    attributes:
      label: Closing date / Sluitingsdatum
      description: Required. The listing disappears automatically after this date.
      placeholder: "2026-12-31"
    validations:
      required: true

  - type: input
    id: apply-url
    attributes:
      label: Application URL
    validations:
      required: true

  - type: textarea
    id: description-nl
    attributes:
      label: Description (Dutch)
      description: What the work actually is. Not a company mission statement.
    validations:
      required: true

  - type: textarea
    id: description-en
    attributes:
      label: Description (English)
    validations:
      required: true

  - type: input
    id: stack
    attributes:
      label: Tech stack
      placeholder: "Go, PostgreSQL, Kubernetes"
    validations:
      required: true
