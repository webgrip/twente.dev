name: "[Workflow] On DNS Change"

concurrency:
  group: dns-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'development' }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - development
    paths:
      - "ops/dns/**"
      - ".forgejo/workflows/on_dns_change.yml"

permissions:
  contents: read

jobs:
  dns-preview:
    name: "DNS Preview"
    uses: webgrip/workflows/.forgejo/workflows/dnscontrol.yml@5a0972c30ef4b2281bb79c61887410a8c3ccc2b6 # v2.6.2
    runs-on: docker
    with:
      mode: preview
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  dns-push:
    name: "DNS Push"
    needs:
      - dns-preview
    uses: webgrip/workflows/.forgejo/workflows/dnscontrol.yml@5a0972c30ef4b2281bb79c61887410a8c3ccc2b6 # v2.6.2
    runs-on: docker
    if: github.ref == 'refs/heads/main'
    with:
      mode: push
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
