name: "[Workflow] On Source Change"

# Consumes the shared library at its Forgejo path (`.forgejo/` tree, per
# webgrip/workflows ADR-0002). NOTE: the `uses:` reference must be the
# `org/repo/path@ref` shorthand, NOT a full https:// URL — Forgejo resolves
# the called workflow's `runs-on` server-side to assign runner labels, and
# with a full URL that resolution fails, leaving the job queued forever with
# an empty label list. The working consumers (e.g. webgrip/workflows'
# on_docs_change.yml) all use the shorthand, SHA-pinned.

concurrency:
  group: push-${{ github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  static-analysis:
    name: "Static Analysis"
    uses: webgrip/workflows/.forgejo/workflows/node-application-static-analysis.yml@f2e235efd0589ee32cef70cd79ee7f110f80d1da # main
    with:
      node-version: "24"
      package-manager: pnpm
      run-format-check: true
      run-lint: true
      run-typecheck: true
      run-audit: true
      run-knip: true

  unit-tests:
    name: "Unit Tests"
    needs:
      - static-analysis
    uses: webgrip/workflows/.forgejo/workflows/node-application-tests.yml@f2e235efd0589ee32cef70cd79ee7f110f80d1da # main
    with:
      node-version: "24"
      package-manager: pnpm
      test-command: pnpm test

  content-validation:
    name: "Content Validation"
    needs:
      - static-analysis
    uses: webgrip/workflows/.forgejo/workflows/node-application-tests.yml@f2e235efd0589ee32cef70cd79ee7f110f80d1da # main
    with:
      node-version: "24"
      package-manager: pnpm
      # REQUIRE_REAL_CONTENT=1 turns the fixture warning into a hard failure: the
      # fixtures are gone, and reintroducing fictional organisations attributed to
      # a real region must not be able to reach main. `test-command` is interpolated
      # into a bash `run:` by the shared workflow, so the env prefix is honoured.
      test-command: REQUIRE_REAL_CONTENT=1 pnpm validate:content

  build:
    name: "Build Site"
    needs:
      - unit-tests
      - content-validation
    # The shared Node "tests" workflow is reused as a build gate via
    # test-command — the same pattern the org's dotnet/node monorepo example
    # uses for its frontend build step.
    uses: webgrip/workflows/.forgejo/workflows/node-application-tests.yml@f2e235efd0589ee32cef70cd79ee7f110f80d1da # main
    with:
      node-version: "24"
      package-manager: pnpm
      test-command: pnpm build

  # Builds ops/docker/web and asserts it serves dist/ under the same rules
  # wrangler.toml configures on Cloudflare: extensionless URLs, a real 404
  # status, correct content types, and the headers from public/_headers.
  #
  # Deliberately NOT a dependency of the deploy jobs. It guards the local
  # preview container, not production, and it assumes the forgejo-runner can
  # build images and reach a published port — which the org does elsewhere
  # (`runs-on: docker` in webgrip/workflows' docker-build-and-push) but we have
  # not verified on this runner. If it turns out unsupported, deleting this one
  # job costs nothing; `just parity` still works locally.
  container-parity:
    name: "Container Parity"
    needs:
      - static-analysis
    runs-on: docker
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -f ops/docker/web/Dockerfile -t twente-dev-web:ci .

      - name: Start container
        run: docker run -d --name twente-web-ci twente-dev-web:ci

      - name: Check Cloudflare parity
        # The job itself runs in a container, so the web container is a
        # sibling on the host daemon — localhost and published ports point at
        # the wrong network namespace. Run the checks in a helper container
        # that SHARES the web container's namespace (--network container:),
        # where localhost:8080 is correct regardless of runner topology. The
        # script rides in on stdin, because bind mounts resolve against the
        # host, where the checkout does not exist.
        run: |
          docker run --rm -i --network container:twente-web-ci \
            -e PARITY_BASE_URL=http://localhost:8080 \
            buildpack-deps:curl bash -s < ops/local/parity-check.sh

      - name: Stop container
        if: always()
        run: docker rm -f twente-web-ci || true

  # Enforces the budgets in lighthouserc.json — without this job they are
  # documentation, not gates. Lighthouse needs Chrome, which the runner image
  # may not carry, so it runs inside a Chrome-equipped container via the same
  # docker capability container-parity already assumes. Same caveat as that
  # job: if the runner turns out not to support it, deleting this job costs
  # nothing and `just lhci` still enforces the budgets locally.
  lighthouse:
    name: "Lighthouse Budgets"
    needs:
      - build
    runs-on: docker
    steps:
      # v5, not v6 — v6 is broken on non-GitHub runners (webgrip/workflows ADR-0002).
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run Lighthouse CI
        run: |
          # autorun with staticDistDir serves ./dist itself, so the container
          # needs no project dependencies — only Node and Chrome.
          #
          # Files go in via `docker cp`, not a bind mount: the job runs in a
          # container, so a -v "$PWD:..." mount resolves $PWD on the HOST
          # daemon, where the checkout does not exist, and lhci sees an empty
          # directory.
          docker rm -f lhci >/dev/null 2>&1 || true
          docker run -d --name lhci -w /repo cypress/browsers:latest sleep 1800
          docker cp dist lhci:/repo/dist
          docker cp lighthouserc.json lhci:/repo/lighthouserc.json
          docker exec -w /repo lhci bash -c "npx --yes @lhci/cli@0.15.x autorun"

      - name: Clean up Lighthouse container
        if: always()
        run: docker rm -f lhci || true

  # Runs the real axe rule set (10x-plan §6.6 item 5). Lighthouse already
  # asserts categories:accessibility at 1.0, but that score is a sampling
  # heuristic — it misses most ARIA and focus-order defects, which is why this
  # exists alongside it rather than instead of it.
  #
  # Same container trick as lighthouse, for the same reason: the runner's docker
  # is a sibling, so bind mounts resolve on the HOST where the checkout does not
  # exist. Everything goes in by `docker cp`.
  accessibility:
    name: "Accessibility (axe-core)"
    needs:
      - build
    runs-on: docker
    steps:
      # v5, not v6 — v6 is broken on non-GitHub runners (webgrip/workflows ADR-0002).
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run axe scan
        run: |
          set -euo pipefail
          # Versions come from package.json so the container cannot drift from
          # the versions a developer gets locally. playwright-core, not
          # playwright: core skips the ~150MB browser download, and the image
          # already ships Chrome — which scripts/axe-scan.ts targets via
          # CHROME_PATH.
          AXE=$(node -p "require('./package.json').devDependencies['@axe-core/playwright']")
          PWC=$(node -p "require('./package.json').devDependencies['playwright-core']")

          docker rm -f axe >/dev/null 2>&1 || true
          docker run -d --name axe -w /repo cypress/browsers:latest sleep 1800
          docker cp dist axe:/repo/dist
          docker cp lighthouserc.json axe:/repo/lighthouserc.json
          docker cp scripts axe:/repo/scripts
          # A MINIMAL package.json, not the repo's. The script is ESM so the
          # container needs "type": "module" to load a .ts entrypoint at all —
          # but copying the real one would make `npm i` resolve every
          # devDependency (astro, eslint, wrangler, …) before installing the two
          # packages actually wanted, which is minutes of nothing useful.
          docker exec -w /repo axe bash -c 'echo "{\"type\":\"module\"}" > package.json'
          docker exec -w /repo axe bash -c \
            "npm i --no-save --silent '@axe-core/playwright@${AXE}' 'playwright-core@${PWC}'"
          docker exec -w /repo axe bash -c \
            "node --experimental-strip-types scripts/axe-scan.ts"

      - name: Clean up axe container
        if: always()
        run: docker rm -f axe || true

  # ---------------------------------------------------------------------------
  # Deploy.
  #
  # Inlined on purpose. There is no Cloudflare workflow in webgrip/workflows yet
  # — this repo is the org's first Cloudflare consumer — and cross-repo
  # `workflow_call` to a local `./.forgejo/...` path is not something we have
  # verified on forgejo-runner. Phase 2 of the plan extracts this into
  # webgrip/workflows as `cloudflare-deploy.yml` in BOTH trees (.github/ and
  # .forgejo/, per that repo's two-tree ADR) and this becomes a `uses:`.
  #
  # wrangler is invoked through `pnpm exec` (it is a devDependency, installed
  # by the install step) rather than a marketplace action so nothing depends on
  # how the runner resolves third-party actions. NOT `pnpm dlx`: dlx installs
  # into a throwaway project that never sees pnpm-workspace.yaml's allowBuilds,
  # so pnpm's build-scripts guard prompts interactively for esbuild/workerd and
  # the job hangs forever.
  # ---------------------------------------------------------------------------
  deploy-preview:
    name: "Deploy Preview"
    needs:
      - build
    if: github.ref != 'refs/heads/main'
    runs-on: docker
    environment: preview
    permissions:
      contents: read
    steps:
      # v5, not v6 — v6 is broken on non-GitHub runners (webgrip/workflows ADR-0002).
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # `versions upload` publishes a non-production version and prints a
          # preview URL. Reviewers see the rendered page, not the YAML diff —
          # the single highest-value CI feature for a content site.
          pnpm exec wrangler versions upload | tee upload.log
          url="$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' upload.log | head -1 || true)"
          echo "preview-url=${url}" >> "$GITHUB_OUTPUT"

      - name: Report preview URL
        if: steps.upload.outputs.preview-url != ''
        run: |
          echo "Preview: ${{ steps.upload.outputs.preview-url }}" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: "Deploy Production"
    needs:
      - build
    if: github.ref == 'refs/heads/main'
    runs-on: docker
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Smoke test
        run: |
          set -euo pipefail

          # Wait for the edge before asserting anything. Run 8 deployed the route
          # successfully ("Deployed twente-dev triggers: twente.dev/*") and then failed
          # here on /nl -> 522, because the smoke step started seconds later and the
          # trigger had not taken effect yet. Asserting immediately turns a healthy
          # deploy into a red pipeline, which is how a smoke test stops being believed.
          for attempt in $(seq 1 12); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://twente.dev/nl || echo 000)"
            [ "${code}" = "200" ] && { echo "edge ready after ${attempt} attempt(s)"; break; }
            echo "waiting for edge (/nl -> ${code}, attempt ${attempt}/12)"
            [ "${attempt}" = "12" ] && { echo "FAIL: edge never became ready"; exit 1; }
            sleep 10
          done

          # /nl/vacatures and /en/jobs are gone since the lean-launch scope cut
          # (job board removed) — the directory pages stand in as the deepest
          # localized routes worth smoke-testing.
          for path in /nl /en /nl/001 /en/001 /nl/bedrijven /en/companies /events.ics /robots.txt; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://twente.dev${path}")"
            echo "${path} -> ${code}"
            [ "${code}" = "200" ] || { echo "FAIL ${path} (expected 200)"; exit 1; }
          done

          # not_found_handling and the front-door redirects are wrangler.toml and
          # _redirects contracts; nothing else in CI exercises them against production.
          check_status() {
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://twente.dev${1}")"
            echo "${1} -> ${code} (expected ${2})"
            [ "${code}" = "${2}" ] || { echo "FAIL ${1}"; exit 1; }
          }
          check_status /nl/this-page-does-not-exist 404
          check_status / 302
          check_status /001 301
