project: twente.dev
description: >-
  De onafhankelijke, practitioner-led techcommunity van Twente. Een gezamenlijke
  agenda, een directory, een archief en een nieuwsbrief het hele jaar door, plus
  een klein aantal genummerde, bewust multidisciplinaire avonden.
version: "0.1.0"

contexts:
  - name: Editie
    description: >-
      De avond zelf en alles wat eromheen geregeld moet worden: datum, zaal,
      programma, aanmelden. Hier is "praten" een Talk en is een Editie een
      gebeurtenis met een datum.
  - name: Publicatie
    description: >-
      Wat er geschreven en verstuurd wordt: artikelen op de site en de mail die
      erover gaat. Hier is "praten" schrijven, en hebben stukken een pillar in
      plaats van een spreker. De woordbotsing die dit model oplost zit precies
      op de grens tussen deze twee contexten.

terms:
  - name: Edition
    context: Editie
    definition: >-
      Eén genummerde avond, geschreven als twente.dev/001. Onderscheidt zich van
      een gewone meetup doordat het nummer permanent is en de avond een archief
      achterlaat. Iedere eerste woensdag van de maand, met verplaatsing alleen
      met opgegeven reden.
    synonyms: [editie, flagship]
    avoid: [meetup, event night]
    examples: ["twente.dev/001 — Reconnect", "twente.dev/002"]
    see_also: [Talk, Registration, Host]

  - name: Talk
    context: Editie
    definition: >-
      Een gesproken bijdrage van twaalf minuten op een Edition, met één claim,
      één echt voorbeeld en één vraag aan de zaal. Gegeven door iemand die het
      werk zelf deed, niet door een vertegenwoordiger ervan.
    synonyms: [talk, praatje]
    avoid: [field report, veldverslag, keynote, presentatie, sessie]
    see_also: [Speaker, Open Call, Edition]

  - name: Speaker
    context: Editie
    definition: >-
      Iemand die een Talk geeft op een Edition. Wordt redactioneel geselecteerd
      en bevestigt zelf de datum voordat de naam ergens verschijnt.
    synonyms: [spreker]
    see_also: [Talk, Open Call]

  - name: Registration
    context: Editie
    definition: >-
      De RSVP van één persoon voor één Edition, afgehandeld op meetup.com. De
      site blijft het verslag van de avond; Meetup draagt alleen de aanmelding.
    synonyms: [aanmelding, RSVP]
    avoid: [ticket, kaartje]
    see_also: [Edition]

  - name: Host
    context: Editie
    definition: >-
      De organisatie die de zaal levert voor een Edition. Krijgt logo,
      bedanking bij de opening en hooguit twee minuten welkomstwoord. Krijgt
      nadrukkelijk geen Talk-slot, geen deelnemerslijst en geen inspraak op het
      programma.
    synonyms: [gastheer]
    avoid: [eigenaar, organisator]
    examples: [Code14]
    see_also: [Partner, Edition]

  - name: Partner
    definition: >-
      Een organisatie die twente.dev steunt onder het gepubliceerde
      partnercompact. Onderscheidt zich van een Host doordat een Partner geen
      zaal hoeft te leveren en een Host geen bijdrage hoeft te doen.
    see_also: [Host]

  - name: Community
    definition: >-
      Een bestaande groep in de regio die in de directory staat. twente.dev
      concurreert niet met een Community en draait geen eigen avond op hun
      avond.
    examples: [TkkrLab, Agile Meetup Twente]

  - name: Field Report
    context: Publicatie
    definition: >-
      Een geschreven stuk uit de praktijk in de regio, gepubliceerd op de site en
      meegestuurd met de nieuwsbrief. Het is één van twee dingen: een interview
      met iemand die hier bouwt, of één concrete les die degene die hem leerde
      zelf opschrijft. Ryans eigen lessen uit het organiseren zijn ook Field
      Reports. Onderscheidt zich van een Talk doordat het geschreven is en niet
      aan een Edition hangt.
    synonyms: [field report]
    avoid: [field note, veldnotitie, portret]
    examples:
      - "Een interview met een embedded engineer bij Thales over wat er misging"
      - "Ryan over wat het kostte om /001 vier weken op te schuiven"
    see_also: [People Who Build, Newsletter, Talk]

  - name: People Who Build
    context: Publicatie
    definition: >-
      De titelreeks waaronder de interview-Field Reports verschijnen, zodat een
      lezer aan de kop ziet dat iemand anders aan het woord is. Geen aparte
      soort en geen pillar: een People Who Build is een Field Report, net als een
      les dat is.
    examples: ["People Who Build: Sanne over de storing die niemand zag"]
    see_also: [Field Report]

  - name: Open Call
    context: Publicatie
    definition: >-
      Een gepubliceerde oproep om iets bij te dragen, meestal een Talk voor de
      eerstvolgende Edition. Staat open zolang de plekken niet gevuld zijn.
    synonyms: [open call, oproep]
    see_also: [Talk, Speaker]

  - name: Week in Twente Tech
    context: Publicatie
    definition: >-
      Een periodiek overzicht van wat er in de regio speelt, samengesteld uit
      de agenda en de Communities. Onderscheidt zich van de andere pillars
      doordat het niets nieuws beweert, alleen verzamelt.

  - name: Newsletter
    context: Publicatie
    definition: >-
      De opt-in maillijst waarop lezers zich abonneren, met dubbele opt-in via
      Brevo. Verstuurt de Publicatie-stukken en de aankondigingen rond een
      Edition. Geen wekelijkse cadans; er gaat een mail uit als er iets te
      melden is.
    synonyms: [nieuwsbrief]
    avoid: [de field note, de field report]
    see_also: [Field Report, People Who Build]

rules:
  - id: R1
    statement: twente.dev wordt altijd met kleine letters geschreven, ook aan het begin van een zin.
    rationale: Het is een domeinnaam en de merkregel; een hoofdletter maakt er een bedrijfsnaam van.
    applies_to: [Edition]
  - id: R2
    statement: >-
      De feiten van de huidige Edition (datum, tijden, stad, venue, capaciteit,
      kosten) staan uitsluitend in src/config/site.ts. Geen enkele pagina
      herhaalt ze als letterlijke tekst.
    rationale: >-
      Herhaalde feiten lopen uiteen, en mensen boeken reizen op deze velden.
    applies_to: [Edition]
  - id: R3
    statement: Spreektijd is niet te koop. Een Speaker wordt redactioneel geselecteerd.
    rationale: Het is een gepubliceerde waarborg en het onderscheidt de avond van een leverancierspodium.
    applies_to: [Talk, Speaker, Partner]
  - id: R4
    statement: >-
      Een Host krijgt logo, bedanking en hooguit twee minuten. Nooit een
      Talk-slot, de deelnemerslijst of inspraak op het programma.
    rationale: De gepubliceerde waarborgen gelden ook voor wie de zaal betaalt, anders zijn het geen waarborgen.
    applies_to: [Host]
  - id: R5
    statement: Een Speaker verschijnt pas op de site nadat die persoon de datum bevestigd heeft.
    rationale: >-
      Een aangekondigde naam is een toezegging aan iemand die het vervolgens aan
      collega's vertelt. Terugtrekken kost die persoon meer dan ons.
    applies_to: [Speaker]
  - id: R6
    statement: >-
      Zijn er op T−4 weken geen twee bevestigde Speakers, dan wordt het een
      lichte avond en geen Edition met een TBA-programma.
    rationale: >-
      Een leeg programma dat toch wordt aangekondigd, kost meer vertrouwen dan
      een eerlijk kleinere avond.
    applies_to: [Edition, Speaker]
  - id: R7
    statement: >-
      Content die aan een echte regionale organisatie wordt toegeschreven, komt
      uit de contributiepijplijn en wordt nooit verzonnen.
    rationale: De directory is alleen iets waard als alles erin klopt.
    applies_to: [Community]
  - id: R8
    statement: >-
      De nieuwsbrief is één lijst met één afmeldknop. Wie zijn adres achterlaat
      krijgt de Field Reports, de Open Calls en de aankondigingen rond een
      Edition, en de opt-intekst noemt ze alle drie.
    rationale: >-
      Aparte lijsten per soort zijn administratie zonder opbrengst zolang er één
      afzender en een handvol verzendingen per kwartaal zijn. Wat wél moet: niet
      meer beloven dan je stuurt, en niet minder. Een lijst die naar één soort
      post is vernoemd, belooft minder dan hij levert.
    applies_to: [Newsletter, Field Report]
  - id: R9
    statement: >-
      Een Host wordt publiek genoemd met een eindig aantal edities, en dat aantal
      is hoogstens wat er is toegezegd. Achter de schermen ligt voor dezelfde
      periode een uitwijklocatie klaar.
    rationale: >-
      Andere bedrijven moeten kunnen zien wanneer de zaal weer vrijkomt, anders
      is de open uitnodiging aan de regio een dode letter, en de site belooft dat
      edities door de regio rouleren. Minder toezeggen dan je hebt, geeft ook
      ruimte om te verhuizen zonder iets terug te nemen. De uitwijklocatie
      bestaat omdat een host die halverwege afhaakt anders het ritme breekt, en
      het ritme is de hele belofte.
    applies_to: [Host]

entities:
  - name: Edition
    context: Editie
    description: Eén genummerde avond, van datumbesluit tot gepubliceerd verslag.
    attributes:
      - name: number
        type: string
        description: Drie cijfers, permanent. Vormt de URL en de naam.
        required: true
      - name: theme
        type: string
        description: Eén woord dat de avond typeert, bijvoorbeeld Reconnect.
        required: true
      - name: date
        type: datetime
        description: Doorgaans de eerste woensdag van de maand. Let op de winter/zomertijdovergang.
        required: true
      - name: capacity
        type: int
        description: Wat de zaal echt kan, niet wat we hopen.
        required: true
      - name: speakers
        type: "Speaker[]"
        description: Leeg tot bevestigd. De lengte bepaalt wat de pagina toont.
    states:
      - from: "[start]"
        to: Gepland
        trigger: Datum en zaal vastgelegd, collision-check gedraaid
      - from: Gepland
        to: Aangekondigd
        trigger: Datum en venue publiek op de site
      - from: Aangekondigd
        to: Aanmelden open
        trigger: Registration-kanaal live gezet
      - from: Aanmelden open
        to: Programma rond
        trigger: Twee Speakers bevestigd (R6)
      - from: Aanmelden open
        to: Lichte avond
        trigger: Op T−4 geen twee bevestigde Speakers (R6)
      - from: Programma rond
        to: Gehouden
        trigger: De avond zelf
      - from: Lichte avond
        to: Gehouden
        trigger: De avond zelf
      - from: Gehouden
        to: Gearchiveerd
        trigger: Openbaar verslag gepubliceerd, binnen tien werkdagen
    relationships:
      - to: Talk
        kind: has_many
        description: Twee bij een volwaardige Edition, nul bij een lichte avond.
      - to: Host
        kind: references
        description: De organisatie die de zaal levert.

  - name: Talk
    context: Editie
    description: Twaalf minuten gesproken, één claim, één voorbeeld, één vraag.
    attributes:
      - name: claim
        type: string
        description: Een precieze stelling, geen onderwerplabel.
        required: true
      - name: example
        type: string
        description: Het besluit, de mislukking of het resultaat dat de claim toetsbaar maakt.
        required: true
      - name: question
        type: string
        description: Het onopgeloste deel waar de zaal bij kan helpen.
        required: true
    relationships:
      - to: Speaker
        kind: belongs_to
        description: Precies één Speaker per Talk.
      - to: Edition
        kind: belongs_to

  - name: Host
    context: Editie
    description: De organisatie die de zaal levert, onder de waarborgen van R4.
    attributes:
      - name: organisation
        type: string
        required: true
      - name: address
        type: string
        description: Staat op de editiepagina, want mensen boeken er reizen op.
        required: true
      - name: editionsCommitted
        type: int
        description: >-
          Het aantal edities dat publiek is toegezegd. Eindig, en hoogstens wat
          de host werkelijk heeft toegezegd.
    relationships:
      - to: Edition
        kind: has_many
        description: Een Host kan meerdere Editions achter elkaar leveren.

  - name: Speaker
    context: Editie
    description: Degene die een Talk geeft.
    attributes:
      - name: name
        type: string
        required: true
      - name: affiliation
        type: string
        description: Waar iemand bouwt. Een bedrijf, lab of school, geen functietitel.
      - name: confirmedAt
        type: datetime
        description: Leeg betekent niet publiceren (R5).
    relationships:
      - to: Talk
        kind: has_one

events:
  - name: EditionAnnounced
    entity: Edition
    description: Datum, stad en venue worden publiek.
    triggers: De Open Call kan de deur uit en de persoonlijke sprekervragen worden verstuurd.
  - name: RegistrationOpened
    entity: Edition
    description: Het aanmeldkanaal gaat open.
    triggers: Het aanmeldgetal wordt het bewijsmateriaal in spreker- en partnervragen.
  - name: SpeakerConfirmed
    entity: Speaker
    description: Een Speaker bevestigt de datum.
    triggers: De naam mag op de site (R5) en het is een eigen aankondigingsmoment.
  - name: EditionHeld
    entity: Edition
    description: De avond heeft plaatsgevonden.
    triggers: Bedankmail naar Speakers binnen drie dagen, verslag binnen tien werkdagen.

dialogues:
  - title: Talk tegenover Field Report
    lines:
      - speaker: Ryan
        text: Kan iemand een **Field Report** komen geven op /001?
      - speaker: Redactie
        text: >-
          Nee. Op een **Edition** geef je een **Talk**, twaalf minuten gesproken.
          Een **Field Report** is geschreven en staat op de site.
      - speaker: Ryan
        text: En als iemand zijn Talk daarna opschrijft?
      - speaker: Redactie
        text: >-
          Dan is dat een tweede ding, geen omzetting. De **Talk** blijft in het
          archief van die **Edition** staan, en het opgeschreven stuk is een
          **Field Report** van de soort "eigen les".
      - speaker: Ryan
        text: En als ik hém erover interview in plaats van dat hij het schrijft?
      - speaker: Redactie
        text: >-
          Ook een **Field Report**, alleen de andere vorm, en die verschijnt
          onder de kop **People Who Build**. De grens is wie de pen vasthoudt.
  - title: Host tegenover Partner
    lines:
      - speaker: Ryan
        text: Code14 betaalt nu ook zes maanden mee. Zijn ze dan Partner geworden?
      - speaker: Redactie
        text: >-
          Ze zijn allebei. **Host** gaat over de zaal, **Partner** over de
          bijdrage. Wat niet verandert is R4: geen **Talk**-slot, geen
          deelnemerslijst, geen inspraak op het programma.
