name: "[Scheduled] Link Check"

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  links:
    name: "Check links in built output"
    uses: webgrip/workflows/.forgejo/workflows/link-check-static-site.yml@cfca5d381db0ae44912faf34e105721eede2ee3e
    with:
      exclude-pattern: '^https://twente\.dev'
      extra-sources: |
        src/content/communities.yml
      dns-hosts-source: src/content/communities.yml
      blocking-urls-command: >-
        node --experimental-strip-types -e
        'import("./src/config/site.ts").then((m) => console.log(m.REGISTRATION_URL ?? ""))'
