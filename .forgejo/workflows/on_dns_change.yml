name: "[Workflow] On DNS Change"

concurrency:
  group: dns-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'development' }}

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "ops/dns/**"
      - ".forgejo/workflows/on_dns_change.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ops/dns/**"
      - ".forgejo/workflows/on_dns_change.yml"

permissions:
  contents: read

jobs:
  dns-preview:
    name: "DNS Preview"
    uses: webgrip/workflows/.forgejo/workflows/dnscontrol.yml@2a5d82e28fbc4226ff620c0d52a774e292e4ba29
    with:
      mode: preview
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  dns-push:
    name: "DNS Push"
    needs:
      - dns-preview
    uses: webgrip/workflows/.forgejo/workflows/dnscontrol.yml@2a5d82e28fbc4226ff620c0d52a774e292e4ba29
    with:
      mode: push
      enabled: ${{ vars.DNS_PUSH == 'on' }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
