- id: coderdojo-enschede
  name: CoderDojo Enschede
  url: https://coderdojo-enschede.nl/
  platform: other
  language: nl
  focus:
    - kids
    - coding
    - education
  description:
    nl: >-
      Door vrijwilligers gerund gratis codeerclubje dat kinderen van 7 tot 17
      leert programmeren en websites, apps en games leert bouwen, elke eerste
      zaterdag van de maand in de Bibliotheek Enschede.
    en: >-
      Volunteer-run free coding club teaching children aged 7 to 17 to
      program and build websites, apps and games, on the first Saturday of
      each month at the Enschede public library.

- id: dutch-laravel-foundation
  name: Dutch Laravel Foundation
  url: https://www.meetup.com/dutchlaravelfoundation/
  platform: meetup
  language: both
  focus:
    - laravel
    - php
    - web
  description:
    nl: >-
      Landelijke non-profitstichting rond het Laravel-ecosysteem in Nederland,
      met meetups vol technische talks en netwerken. Zelf geen Twentse groep. Wel de dichtstbijzijnde actieve plek voor
      Laravel- en PHP-developers uit de regio.
    en: >-
      National non-profit foundation around the Laravel ecosystem in the
      Netherlands, running meetups with technical talks and networking. Not a
      Twente group, but the nearest active one for Laravel and PHP developers
      from the region.

