name: "[Workflow] On Release Published"

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-deploy
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  release-channel:
    name: "Release Channel"
    runs-on: docker
    outputs:
      channel: ${{ steps.parse.outputs.channel }}
    steps:
      - id: parse
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          case "${tag}" in
            v*-*) channel=prerelease ;;
            v*) channel=stable ;;
            *) echo "unexpected release tag: ${tag}" >&2; exit 1 ;;
          esac
          echo "${tag} -> ${channel}"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: "Deploy Staging"
    needs:
      - release-channel
    uses: webgrip/workflows/.forgejo/workflows/cloudflare-deploy.yml@9d3da2af26bda748e13a85ab53fcc3c3ade4744d # v2.5.2
    with:
      enabled: ${{ needs.release-channel.outputs.channel == 'prerelease' }}
      environment: production
      release-channel: prerelease
      wrangler-env: staging
      apex-url: "https://staging.twente.dev"
      edge-probe-path: /nl
      edge-probe-expect: "200"
      check-redirects: false
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-production:
    name: "Deploy Production"
    needs:
      - release-channel
    uses: webgrip/workflows/.forgejo/workflows/cloudflare-deploy.yml@9d3da2af26bda748e13a85ab53fcc3c3ade4744d # v2.5.2
    with:
      enabled: ${{ needs.release-channel.outputs.channel == 'stable' }}
      environment: production
      release-channel: stable
      apex-url: "https://twente.dev"
      edge-probe-path: /nl
      smoke-paths: |
        /nl
        /en
        /nl/001
        /en/001
        /nl/bedrijven
        /en/companies
        /events.ics
        /nl/rss.xml
        /en/rss.xml
        /sitemap-index.xml
        /robots.txt
        /llms.txt
        /.well-known/security.txt
      not-found-path: /nl/this-page-does-not-exist
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  back-merge:
    name: "Safety net: main reachable from development"
    needs:
      - release-channel
      - deploy-production
    if: always() && needs.release-channel.outputs.channel == 'stable'
    runs-on: docker
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.WEBGRIP_CI_TOKEN }}

      - name: Reconcile development when main carries commits of its own
        run: |
          set -euo pipefail
          git fetch origin main development
          if git merge-base --is-ancestor origin/main origin/development; then
            echo "development already carries main; nothing to do. This is the expected outcome: the promotion is a fast-forward, so main is a prefix of development by construction."
            exit 0
          fi
          if git merge-base --is-ancestor origin/development origin/main; then
            git push origin "$(git rev-parse origin/main):refs/heads/development"
            echo "development fast-forwarded onto main. main carried commits of its own, which a fast-forward promotion does not produce — expect an owner hotfix pushed straight to main."
            exit 0
          fi
          echo "::error::main and development have diverged, so the stable tag is not reachable from development. semantic-release will compute the next rc from the last PRERELEASE tag and cut an rc for a version that already shipped. Merge main into development by hand before the next release." >&2
          exit 1

  open-promotion-pr:
    name: "Open or keep the promotion PR"
    needs:
      - release-channel
      - deploy-staging
    if: always() && needs.release-channel.outputs.channel == 'prerelease'
    runs-on: docker
    steps:
      - name: Open or keep promotion PR
        env:
          FORGEJO_TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          RC_TAG: ${{ github.event.release.tag_name }}
          STAGING_DEPLOY: ${{ needs.deploy-staging.result }}
          STAGING_URL: https://staging.twente.dev/nl
        run: |
          set -euo pipefail
          auth="Authorization: token ${FORGEJO_TOKEN}"
          edge="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "${STAGING_URL}" 2>/dev/null || true)"
          staging="staging deploy ${STAGING_DEPLOY}; ${STAGING_URL} answers ${edge:-000}"
          open="$(curl -fsS -H "$auth" "${API}/pulls?state=open&limit=50" \
            | python3 -c 'import sys,json; ps=[p for p in json.load(sys.stdin) if (p.get("head") or {}).get("ref")=="development" and (p.get("base") or {}).get("ref")=="main"]; print(ps[0]["number"] if ps else "")')"
          if [ -n "$open" ]; then
            mergeable="$(curl -fsS -H "$auth" "${API}/pulls/${open}" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("mergeable"))')"
            echo "Promotion PR #${open} already open; ${RC_TAG} cut. ${staging}."
            if [ "$mergeable" != "True" ]; then
              echo "ERROR: promotion PR #${open} is not mergeable. main and development have diverged on content; resolve that before promoting ${RC_TAG}." >&2
              exit 1
            fi
            exit 0
          fi
          total="$(curl -fsS -H "$auth" "${API}/compare/main...development" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("total_commits", len(d.get("commits") or [])))')"
          if [ "${total:-0}" = "0" ]; then
            echo "development has no changes ahead of main."
            exit 0
          fi
          body="Promotes \`${RC_TAG}\` from \`development\` to \`main\` for a stable release and the production deploy.
          When this PR was opened: ${staging}.
          **Merge with a fast-forward, never squash and never a merge commit.** A merge commit exists only on \`main\`, the stable tag lands on it, and semantic-release then computes the next rc from the last prerelease tag — cutting an rc for a version that already shipped. A fast-forward keeps \`main\` a prefix of \`development\`, so there is nothing to reconcile afterwards."
          curl -fsS -H "$auth" -H "Content-Type: application/json" -X POST "${API}/pulls" \
            -d "$(python3 -c 'import json,sys; print(json.dumps({"head":"development","base":"main","title":"chore(release): promote development to main","body":sys.argv[1]}))' "$body")"
          echo "Opened promotion PR for ${RC_TAG}. ${staging}."
