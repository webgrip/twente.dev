name: "[Workflow] On Source Change"

concurrency:
  group: push-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'development' }}

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  static-analysis:
    name: "Static Analysis"
    uses: webgrip/workflows/.forgejo/workflows/node-application-static-analysis.yml@93ff38f11f2da0b33d2a4079fbbfd1b3cfe5399f # v2.9.6
    with:
      node-version: "24"
      package-manager: pnpm
      run-format-check: true
      run-lint: true
      run-typecheck: true
      run-audit: false
      run-knip: true

  tests-and-build:
    name: "Tests & Build"
    uses: webgrip/workflows/.forgejo/workflows/node-application-tests.yml@93ff38f11f2da0b33d2a4079fbbfd1b3cfe5399f # v2.9.6
    with:
      node-version: "24"
      package-manager: pnpm
      test-command: pnpm test && REQUIRE_REAL_CONTENT=1 pnpm validate:content && pnpm validate:mail && pnpm validate:mta-sts && pnpm build
      job-name: Tests & Build

  container-parity:
    name: "Container Parity"
    runs-on: docker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.1"

      - name: Check derived ops config (gen-ops)
        run: node --experimental-strip-types scripts/gen-ops.ts --check

      - name: Build image
        run: docker build -f ops/docker/web/Dockerfile -t twente-dev-web:ci .

      - name: Start container
        run: docker run -d --name twente-web-ci twente-dev-web:ci

      - name: Check Cloudflare parity
        run: |
          docker run --rm -i --network container:twente-web-ci \
            -e PARITY_BASE_URL=http://localhost:8080 \
            buildpack-deps:curl bash -s < ops/local/parity-check.sh

      - name: Stop container
        if: always()
        run: docker rm -f twente-web-ci || true

  lighthouse:
    name: "Lighthouse Budgets"
    uses: webgrip/workflows/.forgejo/workflows/lighthouse-budgets.yml@93ff38f11f2da0b33d2a4079fbbfd1b3cfe5399f # v2.9.6

  accessibility:
    name: "Accessibility (axe-core)"
    uses: webgrip/workflows/.forgejo/workflows/axe-scan.yml@93ff38f11f2da0b33d2a4079fbbfd1b3cfe5399f # v2.9.6

  deploy-preview:
    name: "Deploy Preview (feature branches)"
    needs:
      - tests-and-build
    uses: webgrip/workflows/.forgejo/workflows/cloudflare-deploy.yml@93ff38f11f2da0b33d2a4079fbbfd1b3cfe5399f # v2.9.6
    with:
      environment: preview
      production-refs: refs/heads/main refs/heads/development
      apex-url: "https://twente.dev"
      edge-probe-path: /nl
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  release:
    name: "Release"
    needs:
      - static-analysis
      - tests-and-build
      - container-parity
      - lighthouse
      - accessibility
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
    runs-on: docker
    container:
      image: harbor.webgrip.dev/webgrip/semantic-release:2.3.1@sha256:a39fd2d6a0b29a947903def7ba88b20d17e73d22040ed01fc7b2e2bb6973068a
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/semantic-release@v3.3.2
        with:
          token: ${{ secrets.WEBGRIP_CI_TOKEN }}
          install-dependencies: "false"
