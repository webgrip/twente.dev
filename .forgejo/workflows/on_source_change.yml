name: "[Workflow] On Source Change"

concurrency:
  group: push-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  static-analysis:
    name: "Static Analysis"
    uses: webgrip/workflows/.forgejo/workflows/node-application-static-analysis.yml@fec5377edfef94b7836bb115c732dfee6421e010 # v2.8.3
    with:
      node-version: "24"
      package-manager: pnpm
      run-format-check: true
      run-lint: true
      run-typecheck: true
      run-audit: false
      run-knip: true

  tests-and-build:
    name: "Tests & Build"
    uses: webgrip/workflows/.forgejo/workflows/node-application-tests.yml@fec5377edfef94b7836bb115c732dfee6421e010 # v2.8.3
    with:
      node-version: "24"
      package-manager: pnpm
      test-command: pnpm test && REQUIRE_REAL_CONTENT=1 pnpm validate:content && pnpm validate:mail && pnpm validate:mta-sts && pnpm build
      job-name: Tests & Build

  container-parity:
    name: "Container Parity"
    runs-on: docker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.1"

      - name: Check derived ops config (gen-ops)
        run: node --experimental-strip-types scripts/gen-ops.ts --check

      - name: Build image
        run: docker build -f ops/docker/web/Dockerfile -t twente-dev-web:ci .

      - name: Start container
        run: docker run -d --name twente-web-ci twente-dev-web:ci

      - name: Check Cloudflare parity
        run: |
          docker run --rm -i --network container:twente-web-ci \
            -e PARITY_BASE_URL=http://localhost:8080 \
            buildpack-deps:curl bash -s < ops/local/parity-check.sh

      - name: Stop container
        if: always()
        run: docker rm -f twente-web-ci || true

  lighthouse:
    name: "Lighthouse Budgets"
    uses: webgrip/workflows/.forgejo/workflows/lighthouse-budgets.yml@fec5377edfef94b7836bb115c732dfee6421e010 # v2.8.3

  accessibility:
    name: "Accessibility (axe-core)"
    uses: webgrip/workflows/.forgejo/workflows/axe-scan.yml@fec5377edfef94b7836bb115c732dfee6421e010 # v2.8.3

  deploy-preview:
    name: "Deploy Preview (feature branches)"
    needs:
      - tests-and-build
    uses: webgrip/workflows/.forgejo/workflows/cloudflare-deploy.yml@fec5377edfef94b7836bb115c732dfee6421e010 # v2.8.3
    with:
      environment: preview
      production-refs: refs/heads/main refs/heads/development
      apex-url: "https://twente.dev"
      edge-probe-path: /nl
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  release:
    name: "Release"
    needs:
      - static-analysis
      - tests-and-build
      - container-parity
      - lighthouse
      - accessibility
    uses: webgrip/workflows/.forgejo/workflows/semantic-release.yml@eb866c24264c39956242c553acef3971d018b94c # v3.2.0
    with:
      toolchain-image: harbor.webgrip.dev/webgrip/semantic-release:2.2.1@sha256:54f31b840002423b38860447beb0e48e8e87bb3fbbdb0c09dcd2e03eec5098a9
      only-refs: refs/heads/main refs/heads/development
      install-dependencies: "false"
    secrets:
      CI_TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
