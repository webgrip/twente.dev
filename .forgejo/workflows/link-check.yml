name: "[Scheduled] Link Check"

# Weekly sweep over the built output. Community-submitted content links out to
# employer career pages and meetup sites, which rot faster than anything we
# control — a dead "Apply" link is the most damaging kind of broken link here.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  links:
    name: "Check links in built output"
    runs-on: docker
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install lychee
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/lycheeverse/lychee/releases/latest/download/lychee-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin lychee
          lychee --version

      - name: Check internal links
        # Internal breakage is our fault and blocks.
        #
        # `--fallback-extensions html` because build.format 'file' emits
        # nl/events.html while pages link to /nl/events (clean URLs) — without
        # it, clean-URL links go under-checked. The sanity guard exists because
        # this job's shape elsewhere was green for weeks while checking zero
        # files (vacuous run).
        run: |
          set -euo pipefail
          count="$(find dist -name '*.html' | wc -l)"
          echo "checking ${count} html file(s)"
          [ "${count}" -gt 0 ] || { echo "FAIL: dist bevat geen html — vacuous run"; exit 1; }
          lychee --offline --include-fragments --fallback-extensions html \
            --root-dir "$(pwd)/dist" --no-progress 'dist/**/*.html'

      - name: Check registration link (blocking once it exists)
        # The one external link that may never rot silently once it is set:
        # every "meld je aan" CTA points at it, and a guardrail that only warns
        # guards nothing. While REGISTRATION_URL is null there is no link on
        # the site to guard, and the step says so and passes (honest
        # pre-launch state, src/config/site.ts).
        #
        # Meetup fronts registration pages with bot protection, so a 403 still
        # means "alive"; what must fail is NXDOMAIN/timeout (000), a 404/410
        # (event page deleted) or a 5xx.
        run: |
          set -euo pipefail
          url="$(node --experimental-strip-types -e 'import("./src/config/site.ts").then((m) => console.log(m.REGISTRATION_URL ?? ""))')"
          if [ -z "${url}" ]; then
            echo "REGISTRATION_URL is null — nothing to guard yet"
            exit 0
          fi
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${url}" || echo 000)"
          echo "${url} -> ${code}"
          case "${code}" in
            000|404|410|5*) echo "FAIL: het aanmeldlink-doel is weg of stuk (${code})"; exit 1 ;;
          esac

      - name: Check external links
        # External breakage is the world's fault and only warns — a meetup site
        # being down for an hour should not turn the repo red.
        #
        # communities.yml is checked DIRECTLY, not via dist/. Until 2026-08-30
        # this job scanned only the built output, and getCommunities()
        # (src/lib/content.ts) is defined and never called — so no community URL
        # was ever rendered into a page and this job had never checked a single
        # one of the twelve. Two had silently rotted by the time anyone looked.
        # Keep this input even after the directory renders: it costs nothing and
        # it does not depend on a page existing.
        continue-on-error: true
        run: |
          lychee --no-progress --max-concurrency 4 --timeout 20 --accept 200,206,301,302,403,429 \
            --fallback-extensions html --root-dir "$(pwd)/dist" \
            --exclude '^https://twente\.dev' \
            'dist/**/*.html' 'src/content/communities.yml'

      - name: Resolve directory hosts on multiple public resolvers
        # HTTP checks above use the runner's single resolver, which is exactly
        # how tkkrlab.nl stayed "fine" for weeks: it answers from 1.1.1.1 cache
        # but SERVFAILs on 8.8.8.8, so roughly everyone on Google DNS got
        # nothing while a one-resolver check saw a healthy site. Ask three.
        continue-on-error: true
        run: |
          set -uo pipefail
          apk add --no-cache bind-tools 2>/dev/null || apt-get -qq update && apt-get -qq install -y dnsutils || true
          grep -oE 'url: https?://[^/]+' src/content/communities.yml \
            | sed -E 's#url: https?://##' | sort -u > /tmp/hosts.txt
          echo "checking $(wc -l < /tmp/hosts.txt) hosts against 1.1.1.1, 8.8.8.8, 9.9.9.9"
          bad=0
          # read-loop, not `for h in $hosts` — the latter relies on the shell
          # word-splitting an unquoted variable, which zsh does not do, so the
          # same script silently checked one giant concatenated "host" locally.
          while IFS= read -r h; do
            [ -n "$h" ] || continue
            for r in 1.1.1.1 8.8.8.8 9.9.9.9; do
              if ! dig +short +time=5 +tries=2 "@$r" "$h" A | grep -qE '^[0-9]'; then
                echo "::warning::$h does not resolve on $r"
                bad=$((bad + 1))
              fi
            done
          done < /tmp/hosts.txt
          echo "resolver failures: $bad"
          [ "$bad" -eq 0 ] || echo "::warning::a directory host is unreachable from at least one major resolver — visitors on it get nothing"
