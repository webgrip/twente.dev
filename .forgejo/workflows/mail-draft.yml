name: "[Manual] Mail Draft"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Doel uit pnpm mail, bijvoorbeeld post:open-call-001"
        required: true
        type: string
      locale:
        description: "nl of en; leeg is beide talen"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  draft:
    name: "Draft in Brevo"
    runs-on: docker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Create or update the draft
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_TARGET: ${{ inputs.target }}
          MAIL_LOCALE: ${{ inputs.locale }}
        run: pnpm mail:draft "$MAIL_TARGET" $MAIL_LOCALE
