name: "[Scheduled] Nightly Rebuild"

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  rebuild:
    name: "Rebuild and redeploy"
    runs-on: docker
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check out the latest stable release
        run: |
          set -euo pipefail
          tag="$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-' | head -1 || true)"
          if [ -z "${tag}" ]; then
            echo "no stable release yet, nothing to redeploy"
            exit 0
          fi
          echo "redeploying ${tag}"
          git checkout --quiet "${tag}"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
