- id: dutch-laravel-foundation
  # NATIONAL, not regional — the one deliberate exception in this file, and it
  # needs a reason. This file's own header records PHP Twente as dormant since
  # before 2024, so a Laravel or PHP developer in Twente has no local group at
  # all; the nearest active one is national. Listing it is more useful than
  # pretending the gap does not exist. If a regional PHP/Laravel group revives,
  # prefer that one.
  #
  # Facts checked 2026-08-31 via web search: non-profit foundation strengthening
  # the Laravel ecosystem in the Netherlands, running meetups with technical
  # talks and networking, with agencies, freelancers and IT departments as
  # members. Canonical link is the Meetup group (that is where the events are);
  # VERIFY the spoken language with them when asking for consent — the evidence
  # shows both Dutch and English events and this entry guesses "both".
  name: Dutch Laravel Foundation
  url: https://www.meetup.com/dutchlaravelfoundation/
  platform: meetup
  language: both
  focus:
    - laravel
    - php
    - web
  description:
    nl: >-
      Landelijke non-profitstichting rond het Laravel-ecosysteem in Nederland,
      met meetups vol technische talks en netwerken. Geen Twentse groep, maar
      wel de dichtstbijzijnde actieve plek voor Laravel- en PHP-developers uit
      de regio.
    en: >-
      National non-profit foundation around the Laravel ecosystem in the
      Netherlands, running meetups with technical talks and networking. Not a
      Twente group, but the nearest active one for Laravel and PHP developers
      from the region.

