description:
  nl: >-
    Een practitioner-led avond voor software, infrastructuur, embedded systems,
    maakindustrie, data, security, design, product, onderzoek en technisch
    onderwijs. Twee korte field reports en één begeleid gesprek zorgen voor de
    gezamenlijke vraag; gestructureerde kennismakingen en een ruim netwerkuur
    maken de avond nuttig. Geen banenmarkt, geen leverancierspodium.
  en: >-
    A practitioner-led evening for software, infrastructure, embedded systems,
    manufacturing, data, security, design, product, research and technical
    education. Two short field reports and one facilitated conversation create
    the shared question; structured introductions and an open network hour make
    the room useful. This is not a recruitment fair or vendor stage.
