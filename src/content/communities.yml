  platform: other
  language: both
  focus:
    - hackerspace
    - hardware
    - electronics
    - making
  description:
    nl: >-
      Door de community gerund hackerspace/makerspace aan de Marssteden in
      Enschede met 3D-printers, lasersnijder en elektronicawerkplekken, met
      regelmatige workshops en CyberSaturday-avonden.
    en: >-
      Community-run hackerspace/makerspace at Marssteden in Enschede with 3D
      printers, a laser cutter and electronics benches, hosting regular
      workshops and CyberSaturday evenings.

