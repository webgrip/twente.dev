name: "[Workflow] On Documentation Change"

on:
  push:
    branches:
      - "*"
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".forgejo/workflows/on_docs_change.yml"
      - "scripts/validate-docs-links.ts"
  workflow_dispatch:
    inputs:
      source-dir:
        type: string
        description: "The directory containing the mkdocs config"
        required: false
        default: "."

jobs:
  docs-links:
    name: "Docs links"
    runs-on: docker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Check relative markdown links inside docs/
        run: node --experimental-strip-types scripts/validate-docs-links.ts

  generate-documentation:
    name: "Generate"
    uses: webgrip/workflows/.forgejo/workflows/techdocs-generate.yml@50fab8d095be39956e5aff4cba2c42bb3428454d # v1.11.3
    with:
      source-dir: ${{ github.event.inputs.source-dir || '.' }}

  deploy-docs-site:
    name: "Deploy (docs site / Garage web)"
    uses: webgrip/workflows/.forgejo/workflows/techdocs-deploy-docs-site.yml@50fab8d095be39956e5aff4cba2c42bb3428454d # v1.11.3
    needs: generate-documentation
    runs-on: docker
    if: github.ref == 'refs/heads/main'
    with:
      source-dir: "."
      bucket: docs-twente.dev
      strict: "true"
    secrets:
      TECHDOCS_S3_ACCESS_KEY_ID: ${{ secrets.TECHDOCS_S3_ACCESS_KEY_ID }}
      TECHDOCS_S3_SECRET_ACCESS_KEY: ${{ secrets.TECHDOCS_S3_SECRET_ACCESS_KEY }}
