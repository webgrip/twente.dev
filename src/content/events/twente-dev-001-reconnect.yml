title:
  nl: "twente.dev/001: Reconnect"
  en: "twente.dev/001: Reconnect"
description:
  nl: >-
    Een practitioner-led avond voor software, infrastructuur, embedded systems,
    maakindustrie, data, security, design, product, onderzoek en technisch
    onderwijs. Twee talks van ongeveer een halfuur, van mensen die het werk zelf
    deden, en daarna een ruim netwerkuur om elkaar echt te spreken. Geen
    banenmarkt, geen leverancierspodium.
  en: >-
    A practitioner-led evening for software, infrastructure, embedded systems,
    manufacturing, data, security, design, product, research and technical
    education. Two roughly half-hour talks by people who did the work themselves,
    and then an unhurried network hour to actually meet each other. This is not a
    recruitment fair or vendor stage.
