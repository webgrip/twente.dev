name: "[Scheduled] Mail Auth Drift"

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: "Mail Auth Drift"
    uses: webgrip/workflows/.forgejo/workflows/node-application-tests.yml@43f4088df6df3f225a07ab66b9f2b4c4d23cf579 # v2.7.1
    with:
      node-version: "24"
      package-manager: pnpm
      test-command: pnpm validate:mail-auth
      job-name: Mail Auth Drift
