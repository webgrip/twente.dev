name: twente-dev

services:
  dev:
    image: docker.io/library/node:24-bookworm-slim
    working_dir: /src
    environment:
      ASTRO_TELEMETRY_DISABLED: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      CHOKIDAR_USEPOLLING: "1"
    volumes:
      - ../..:/src
      - dev-node-modules:/src/node_modules
      - dev-pnpm-store:/pnpm/store
    ports:
      - "4321:4321"
    command: >
      sh -c "corepack enable &&
             pnpm config set store-dir /pnpm/store &&
             pnpm install --frozen-lockfile &&
             pnpm dev --host 0.0.0.0"

  preview:
    build:
      context: ../..
      dockerfile: ops/docker/web/Dockerfile
    image: twente-dev-web:local
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  dev-node-modules:
  dev-pnpm-store:
