<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>twente.dev — e-mail signature</title>
  </head>
  <body
    style="font-family: -apple-system, system-ui, sans-serif; background: #f7f3ea; padding: 2rem"
  >
    <p style="max-width: 40rem; color: #4a545c; font-size: 0.9rem">
      Select everything inside the frame, copy, paste into your mail client's signature field. Edit
      name and role before copying.
    </p>

    <div style="border: 1px dashed #d9dfdc; padding: 1.5rem; max-width: 34rem; background: #fffdf8">
      <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse">
        <tr>
          <td style="padding-right: 14px; vertical-align: middle">
            <img
              src="https://twente.dev/brand/png/mark-512.png"
              width="44"
              height="44"
              alt="twente.dev"
              style="display: block"
            />
          </td>
          <td style="vertical-align: middle; border-left: 1px solid #d9dfdc; padding-left: 14px">
            <div
              style="
                font-family: -apple-system, system-ui, sans-serif;
                font-size: 14px;
                font-weight: 600;
                color: #111820;
              "
            >
              Firstname Lastname
            </div>
            <div
              style="
                font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
                font-size: 11px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: #4a545c;
                padding-top: 2px;
              "
            >
              organiser · twente<span style="color: #c3291b">.</span>dev
            </div>
            <div
              style="
                font-family: -apple-system, system-ui, sans-serif;
                font-size: 12px;
                color: #4a545c;
                padding-top: 6px;
              "
            >
              <a href="https://twente.dev" style="color: #c3291b; text-decoration: none"
                >twente.dev</a
              >
              &nbsp;·&nbsp;
              <a href="mailto:hello@twente.dev" style="color: #111820; text-decoration: none"
                >hello@twente.dev</a
              >
            </div>
            <div
              style="
                font-family: -apple-system, system-ui, sans-serif;
                font-size: 11px;
                color: #7a848c;
                padding-top: 4px;
              "
            >
              Webgrip · Koekoekstraat 8, 7523 WZ Enschede
            </div>
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
