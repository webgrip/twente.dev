name: "[Workflow] Open Promotion PR"

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open-promotion-pr:
    name: "Open or keep the development to main PR"
    runs-on: docker
    steps:
      - uses: actions/checkout@v5
      - name: Open or keep promotion PR
        env:
          FORGEJO_TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -euo pipefail
          auth="Authorization: token ${FORGEJO_TOKEN}"
          existing="$(curl -fsS -H "$auth" "${API}/pulls?state=open&base=main" \
            | python3 -c 'import sys,json; print(sum(1 for p in json.load(sys.stdin) if (p.get("head") or {}).get("ref")=="development"))')"
          if [ "$existing" != "0" ]; then
            echo "Promotion PR already open."
            exit 0
          fi
          total="$(curl -fsS -H "$auth" "${API}/compare/main...development" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("total_commits", len(d.get("commits") or [])))')"
          if [ "${total:-0}" = "0" ]; then
            echo "development has no changes ahead of main."
            exit 0
          fi
          body='Promotes the rc state verified on staging.twente.dev from `development` to `main` for a stable release and the production deploy.
          **Merge with a merge commit or rebase merge, never squash.** semantic-release needs the original commits to compute the stable version.'
          curl -fsS -H "$auth" -H "Content-Type: application/json" -X POST "${API}/pulls" \
            -d "$(python3 -c 'import json,sys; print(json.dumps({"head":"development","base":"main","title":"chore(release): promote development to main","body":sys.argv[1]}))' "$body")"
          echo "Opened promotion PR."
