<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>twente.dev — e-mail basis (Brevo)</title>
    <!--
  BASIS. Kopieer dit bestand als je een nieuw mailtype nodig hebt; de drie
  bestaande types (field-note, announcement, transactional) zijn er zo ook
  gemaakt. Alles wat hier staat is meubilair — het inhoudsblok is leeg.

  DE REGELS DIE JE NIET MOET WEGHALEN
  - Tabellen en inline styles. Mailclients negeren externe CSS en de helft
    kent geen flexbox. Geen kaart-in-een-kaart: één vlak warm papier.
  - Eén rood signaal per mail, en alleen waar het betekenis draagt.
  - Separator is altijd // — nooit één schuine streep.
  - Geen afbeelding die stiekem een tracking pixel is. Anonieme tracking
    staat aan in Brevo; /privacy belooft dat en dat is geen voorkeur.
  - {{ unsubscribe }} blijft staan in alles wat marketing is. In
    transactionele mail hoort hij juist NIET (zie email-transactional.html).

  BREVO
  Campaigns → Email → New campaign → "Paste your code", of
  Templates → New template → Code your own. Plak het hele bestand.
-->
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f7f3ea;
      color: #111820;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    "
  >
    <div
      style="
        display: none;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        color: transparent;
        height: 0;
        width: 0;
      "
    >
      ⟦Preheader — de regel naast het onderwerp in de inbox. Vul hem, anders leest de client je
      eerste zin voor.⟧
    </div>

    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
      width="100%"
      style="background: #f7f3ea"
    >
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            border="0"
            width="600"
            style="width: 100%; max-width: 600px; text-align: left"
          >
            <!-- WOORDMERK -->
            <tr>
              <td style="padding-bottom: 28px">
                <a href="https://twente.dev" style="text-decoration: none"
                  ><img
                    src="https://twente.dev/brand/png/lockup-horizontal-512.png"
                    alt="twente.dev"
                    width="180"
                    height="31"
                    style="display: block; width: 180px; height: 31px; border: 0"
                /></a>
              </td>
            </tr>

            <!-- EYEBROW — mono label, geen zin -->
            <tr>
              <td
                style="
                  padding-bottom: 10px;
                  font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
                  font-size: 12px;
                  letter-spacing: 0.08em;
                  text-transform: uppercase;
                  color: #5d666e;
                "
              >
                ⟦Label // context⟧
              </td>
            </tr>

            <!-- KOP -->
            <tr>
              <td
                style="
                  padding-bottom: 20px;
                  font-size: 28px;
                  line-height: 1.2;
                  font-weight: 700;
                  letter-spacing: -0.02em;
                "
              >
                ⟦Kop⟧
              </td>
            </tr>

            <!-- INHOUD -->
            <tr>
              <td style="font-size: 16px; line-height: 1.6; color: #111820; padding-bottom: 28px">
                <p style="margin: 0 0 16px">⟦Inhoud.⟧</p>
              </td>
            </tr>

            <!-- FOOTER -->
            <tr>
              <td
                style="
                  border-top: 1px solid #b6bfbb;
                  padding-top: 20px;
                  font-size: 14px;
                  line-height: 1.6;
                  color: #4a545c;
                "
              >
                <p style="margin: 0 0 12px">
                  <strong style="color: #111820">Antwoorden mag.</strong> Deze mail komt bij een
                  mens binnen.
                </p>
                <p style="margin: 0 0 12px">⟦Waarom je dit krijgt — één zin, altijd waar.⟧</p>
                <p style="margin: 0">
                  <a href="{{ unsubscribe }}" style="color: #4a545c; text-decoration: underline"
                    >Afmelden</a
                  >
                  //
                  <a
                    href="https://twente.dev/nl/privacy"
                    style="color: #4a545c; text-decoration: underline"
                    >Privacy</a
                  >
                  //
                  <a href="https://twente.dev" style="color: #4a545c; text-decoration: underline"
                    >twente.dev</a
                  >
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
