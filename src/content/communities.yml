- id: agile-meetup-twente
  name: Agile Meetup Twente
  url: https://www.meetup.com/agile-meetup-twente/
  platform: meetup
  language: nl
  focus:
    - agile
    - scrum
    - ways-of-working
  description:
    nl: >-
      Meetupgroep voor iedereen die met Agile werkt of wil werken in Twente,
      met enkele bijeenkomsten per jaar in Enschede met presentaties en
      discussie.
    en: >-
      Meetup group for people working with or interested in Agile in the
      Twente region, gathering a few times a year in Enschede for talks and
      discussion.

- id: women-in-tech-twente
