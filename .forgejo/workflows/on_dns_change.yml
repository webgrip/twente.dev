name: "[Workflow] On DNS Change"

concurrency:
  group: dns-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'development' }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - development
    paths:
      - "ops/dns/**"
      - ".forgejo/workflows/on_dns_change.yml"

permissions:
  contents: read

jobs:
  dns-preview:
    name: "DNS Preview"
    runs-on: docker
    enable-openid-connect: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Cloudflare read-only credentials from OpenBao
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/openbao-read@26b990c6e51762be406efb29b870e05b70bb5a4d # v2.8.0
        with:
          role: ci-twente-dev
          secrets: |
            CLOUDFLARE_API_TOKEN=secret/data/cloudflare/dns/twente-dev-ro#token
            CLOUDFLARE_ACCOUNT_ID=secret/data/cloudflare/dns/twente-dev-ro#account_id

      - name: Install dnscontrol
        shell: bash
        env:
          # renovate: datasource=github-releases depName=StackExchange/dnscontrol
          VERSION: "5.0.3"
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64 | arm64) arch=arm64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          base="https://github.com/StackExchange/dnscontrol/releases/download/v${VERSION}"
          archive="dnscontrol_${VERSION}_linux_${arch}.tar.gz"
          workdir="$(mktemp -d)"
          curl -fsSL "${base}/${archive}" -o "${workdir}/${archive}"
          curl -fsSL "${base}/checksums.txt" -o "${workdir}/checksums.txt"
          (cd "${workdir}" && grep " ${archive}\$" checksums.txt | sha256sum -c -)
          tar -xzf "${workdir}/${archive}" -C "${workdir}" dnscontrol
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "${workdir}/dnscontrol" "${HOME}/.local/bin/dnscontrol"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      - name: Check
        shell: bash
        working-directory: ops/dns
        run: dnscontrol check

      - name: Preview
        shell: bash
        working-directory: ops/dns
        run: |
          set -uo pipefail
          dnscontrol preview --creds creds.json > preview.raw 2>&1
          rc=$?
          sed 's/\x1b\[[0-9;]*m//g' preview.raw > preview.txt
          cat preview.txt
          { echo '```'; cat preview.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "${rc}"
