server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/calendar
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml;

    location ~ ^(/.+)\.html$ {
        return 301 $1$is_args$args;
    }

    # BEGIN generated from public/_redirects

    location = / {
        return 302 /nl;
    }

    location = /001 {
        return 301 /nl/001;
    }

    location = /brand/twente-dev-mark.svg {
        return 301 /brand/mark.svg;
    }

    location = /brand/twente-dev-mark.png {
        return 301 /brand/png/mark-512.png;
    }

    location = /brand/twente-dev-logo.png {
        return 301 /brand/png/lockup-horizontal-512.png;
    }

    # END generated from public/_redirects

    # BEGIN generated from public/_headers

    location /_astro/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /pagefind/index/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /pagefind/fragment/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /pagefind/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    location /brand/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location = /events.ics {
        include /etc/nginx/conf.d/security-headers.conf;
        default_type text/calendar;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /nl/rss.xml {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /en/rss.xml {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # END generated from public/_headers

    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /_headers {
        return 404;
    }
}
