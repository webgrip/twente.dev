<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>twente.dev — speaker tile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Inter:wght@400;550;650;830&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #111820;
        --red: #c3291b;
        --red-light: #ea6250;
        --paper: #f7f3ea;
        --grey: #d9dfdc;
        --muted: #4a545c;
        --sans: 'Inter', -apple-system, system-ui, sans-serif;
        --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;

        --block: 726px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: #c9c5bc;
        font-family: var(--sans);
        color: var(--ink);
      }

      .tile {
        width: 1080px;
        height: 1080px;
        background: var(--paper);
        position: relative;
        display: flex;
        flex-direction: column;
        padding: 64px 72px 0 96px;
        overflow: hidden;
      }
      @media screen {
        .tile {
          margin: 1rem auto;
          box-shadow: 0 2px 14px rgb(17 24 32 / 0.25);
        }
      }
      @page {
        size: 1080px 1080px;
        margin: 0;
      }
      @media print {
        body {
          background: none;
        }
        .tile {
          margin: 0;
          box-shadow: none;
        }
      }

      .tile::before {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 24px;
        background: var(--red);
      }

      .head {
        display: flex;
        gap: 48px;
        align-items: flex-start;
        flex: 1;
      }

      .portrait {
        flex: 0 0 470px;
        height: var(--block);
        background: var(--grey);
        position: relative;
        overflow: hidden;
      }
      .portrait img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        position: relative;
        z-index: 1;
      }
      .portrait::after {
        content: 'portrait.jpg';
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--mono);
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .col {
        flex: 1;
        min-width: 0;
        height: var(--block);
        padding-top: 8px;
        display: flex;
        flex-direction: column;
      }

      .edition {
        font-family: var(--mono);
        font-weight: 700;
        font-size: 30px;
        letter-spacing: -0.01em;
      }
      .edition .dot {
        color: var(--red);
      }

      .label {
        font-family: var(--mono);
        font-weight: 500;
        font-size: 17px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .name {
        font-weight: 830;
        font-size: 62px;
        line-height: 0.98;
        letter-spacing: -0.035em;
        text-transform: uppercase;
        margin-top: 46px;
      }
      .role {
        font-size: 25px;
        line-height: 1.35;
        color: var(--muted);
        margin-top: 18px;
      }

      .rule {
        border: 0;
        border-top: 1px solid var(--ink);
        margin: auto 0 34px;
      }

      .talk {
        font-weight: 650;
        font-size: 38px;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }

      .band {
        margin: auto -72px 0 -96px;
        background: var(--ink);
        color: var(--paper);
        padding: 46px 72px 46px 96px;
      }
      .when {
        font-family: var(--mono);
        font-weight: 500;
        font-size: 22px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--red-light);
      }
      .motto {
        font-weight: 650;
        font-size: 34px;
        letter-spacing: -0.02em;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="head">
        <div class="portrait"><img src="portrait.jpg" alt="" onerror="this.remove()" /></div>

        <div class="col">
          <div class="edition" contenteditable="true">twente<span class="dot">.</span>dev/001</div>
          <div class="label" style="margin-top: 34px">speaker</div>

          <div class="name" contenteditable="true">Firstname<br />Lastname</div>
          <div class="role" contenteditable="true">Role · organisation</div>

          <hr class="rule" />

          <div class="talk" contenteditable="true">
            Talk title goes here,<br />over no more than<br />three lines.
          </div>
        </div>
      </div>

      <div class="band">
        <div class="when" contenteditable="true">04 nov 2026 · 18:00 · rijssen</div>
        <div class="motto">We build it. We run it. We share it.</div>
      </div>
    </div>
  </body>
</html>
