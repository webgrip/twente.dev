name: "[Scheduled] Mail Auth Drift"

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: "Mail Auth Drift"
    uses: webgrip/workflows/.forgejo/workflows/node-application-tests.yml@f93a82cd695cbe53bace44d7bc58bd4dab5f9c4b # main after v4.2.0: full action URLs
    with:
      runs-on: node-ci
      node-version: "24"
      package-manager: pnpm
      test-command: pnpm validate:mail-auth
      job-name: Mail Auth Drift
