name: "[Scheduled] Mail Auth Drift"

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: "Mail Auth Drift"
    uses: webgrip/workflows/.forgejo/workflows/node-application-tests.yml@92365b422cccc1aac723c8edd57e514daac85db3
    with:
      node-version: "24"
      package-manager: pnpm
      test-command: pnpm validate:mail-auth
      job-name: Mail Auth Drift
