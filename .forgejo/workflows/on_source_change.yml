name: "[Workflow] On Source Change"

concurrency:
  group: push-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'development' }}

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  static-analysis:
    name: "Static Analysis"
    uses: webgrip/workflows/.forgejo/workflows/node-application-static-analysis.yml@f2e235efd0589ee32cef70cd79ee7f110f80d1da
    with:
      node-version: "24"
      package-manager: pnpm
      run-format-check: true
      run-lint: true
      run-typecheck: true
      run-audit: false
      run-knip: true

  unit-tests:
    name: "Unit Tests"
    needs:
      - static-analysis
    uses: webgrip/workflows/.forgejo/workflows/node-application-tests.yml@ef2b7a61a56c57efc41a4738009c793d200b20c2
    with:
      node-version: "24"
      package-manager: pnpm
      test-command: pnpm test
      job-name: Unit Tests

  content-validation:
    name: "Content Validation"
    needs:
      - static-analysis
    uses: webgrip/workflows/.forgejo/workflows/node-application-tests.yml@ef2b7a61a56c57efc41a4738009c793d200b20c2
    with:
      node-version: "24"
      package-manager: pnpm
      test-command: REQUIRE_REAL_CONTENT=1 pnpm validate:content
      job-name: Content Validation

  mail-validation:
    name: "Mail Validation"
    needs:
      - static-analysis
    uses: webgrip/workflows/.forgejo/workflows/node-application-tests.yml@ef2b7a61a56c57efc41a4738009c793d200b20c2
    with:
      node-version: "24"
      package-manager: pnpm
      test-command: pnpm validate:mail
      job-name: Mail Validation

  build:
    name: "Build Site"
    needs:
      - unit-tests
      - content-validation
      - mail-validation
    uses: webgrip/workflows/.forgejo/workflows/node-application-tests.yml@ef2b7a61a56c57efc41a4738009c793d200b20c2
    with:
      node-version: "24"
      package-manager: pnpm
      test-command: pnpm build
      job-name: Build Site

  container-parity:
    name: "Container Parity"
    needs:
      - static-analysis
    runs-on: docker
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check derived ops config (gen-ops)
        run: node --experimental-strip-types scripts/gen-ops.ts --check

      - name: Build image
        run: docker build -f ops/docker/web/Dockerfile -t twente-dev-web:ci .

      - name: Start container
        run: docker run -d --name twente-web-ci twente-dev-web:ci

      - name: Check Cloudflare parity
        run: |
          docker run --rm -i --network container:twente-web-ci \
            -e PARITY_BASE_URL=http://localhost:8080 \
            buildpack-deps:curl bash -s < ops/local/parity-check.sh

      - name: Stop container
        if: always()
        run: docker rm -f twente-web-ci || true

  lighthouse:
    name: "Lighthouse Budgets"
    needs:
      - build
    uses: webgrip/workflows/.forgejo/workflows/lighthouse-budgets.yml@cfca5d381db0ae44912faf34e105721eede2ee3e

  accessibility:
    name: "Accessibility (axe-core)"
    needs:
      - build
    uses: webgrip/workflows/.forgejo/workflows/axe-scan.yml@a3e0e8dff4199f592b7596e411f564bcaab67665

  deploy-preview:
    name: "Deploy Preview"
    needs:
      - build
    uses: webgrip/workflows/.forgejo/workflows/cloudflare-deploy.yml@cfca5d381db0ae44912faf34e105721eede2ee3e
    with:
      environment: preview
      production-refs: refs/heads/main refs/heads/development
      apex-url: "https://twente.dev"
      edge-probe-path: /nl
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  release:
    name: "Release"
    needs:
      - build
      - container-parity
      - lighthouse
      - accessibility
    uses: webgrip/workflows/.forgejo/workflows/semantic-release.yml@2df9161cf4c7d6425e0051583f5d85dbdebcce48
    with:
      only-refs: refs/heads/main refs/heads/development
    secrets:
      CI_TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
