name: "[Scheduled] Mail Auth Drift"

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: "Mail Auth Drift"
    uses: webgrip/workflows/.forgejo/workflows/node-application-tests.yml@14870460443dac1e03fc3eccdebcec56d748fbb1 # v2.7.4
    with:
      node-version: "24"
      package-manager: pnpm
      test-command: pnpm validate:mail-auth
      job-name: Mail Auth Drift
