name: "[Scheduled] Mail Auth Drift"

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: "Mail Auth Drift"
    uses: webgrip/workflows/.forgejo/workflows/node-application-tests.yml@93ff38f11f2da0b33d2a4079fbbfd1b3cfe5399f # v2.9.6
    with:
      node-version: "24"
      package-manager: pnpm
      test-command: pnpm validate:mail-auth
      job-name: Mail Auth Drift
